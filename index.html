<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Moliya Pro</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(18, 23, 38, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: linear-gradient(135deg, #38bdf8 0%, #3b82f6 50%, #6366f1 100%);
      --income: #10b981;
      --expense: #f43f5e;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.1) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      overflow-x: hidden;
    }

    /* Ruxsat berilmagan holat */
    #blockedScreen {
      display: none;
      min-height: 80vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .lock-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      margin-bottom: 16px;
    }

    /* Asosiy panel */
    #appContent {
      display: block;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 600;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 16px;
      backdrop-filter: blur(16px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }

    .bal-title {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
    }

    .bal-sum {
      font-size: 32px;
      font-weight: 800;
      margin: 8px 0 16px;
      font-family: var(--font-mono);
      letter-spacing: -0.5px;
    }

    .bal-sum span {
      font-size: 18px;
      color: var(--text-muted);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 14px;
    }

    .stat-pill {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--card-border);
      padding: 10px 12px;
      border-radius: 14px;
    }

    .stat-lbl {
      font-size: 11px;
      color: var(--text-muted);
    }

    .stat-val {
      font-size: 15px;
      font-weight: 700;
      font-family: var(--font-mono);
      margin-top: 4px;
    }

    .inc-text { color: var(--income); }
    .exp-text { color: var(--expense); }

    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .act-btn {
      border: none;
      padding: 14px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .act-btn:active {
      transform: scale(0.97);
    }

    .btn-inc {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    }

    .btn-exp {
      background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
    }

    .chart-container {
      position: relative;
      height: 200px;
      width: 100%;
      margin: 10px 0;
    }

    .tx-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tx-item:last-child {
      border-bottom: none;
    }

    .tx-name {
      font-size: 14px;
      font-weight: 600;
    }

    .tx-date {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .tx-amt {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 700;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      z-index: 1000;
      align-items: flex-end;
    }

    .modal-box {
      background: #0f1422;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px 24px 0 0;
      width: 100%;
      padding: 22px 18px 30px;
    }

    .custom-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      font-size: 16px;
      outline: none;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <!-- Begonalar uchun Blok oynasi -->
  <div id="blockedScreen">
    <div class="lock-circle">🔒</div>
    <h3 style="font-size: 20px; font-weight: 800; margin-bottom: 8px;">Kirish Cheklangan</h3>
    <p style="color: var(--text-muted); font-size: 13px; max-width: 260px;">
      Bu moliyaviy tizim faqat ruxsat berilgan 2 ta maxsus hisob egasi uchun yopiq rejimda ishlaydi.
    </p>
  </div>

  <!-- Asosiy UI -->
  <div id="appContent">
    <div class="header-bar">
      <div class="user-badge" id="userPill">
        <span>👤</span>
        <span id="userNameTxt">Foydalanuvchi</span>
      </div>
      <div style="font-size: 11px; color: #34d399; font-weight: 700; background: rgba(16, 185, 129, 0.12); padding: 5px 10px; border-radius: 100px; border: 1px solid rgba(16, 185, 129, 0.3);">
        ● Moliya Pro
      </div>
    </div>

    <div class="card">
      <div class="bal-title">Sof Balans</div>
      <div class="bal-sum" id="totalBalanceVal">0 <span>UZS</span></div>

      <div class="stats-row">
        <div class="stat-pill">
          <div class="stat-lbl">Umumiy Kirim</div>
          <div class="stat-val inc-text" id="incTotalVal">+0 UZS</div>
        </div>
        <div class="stat-pill">
          <div class="stat-lbl">Umumiy Chiqim</div>
          <div class="stat-val exp-text" id="expTotalVal">-0 UZS</div>
        </div>
      </div>
    </div>

    <div class="actions-grid">
      <button class="act-btn btn-inc" onclick="openInput('income')">＋ Kirim</button>
      <button class="act-btn btn-exp" onclick="openInput('expense')">− Chiqim</button>
    </div>

    <div class="card">
      <div class="bal-title" style="margin-bottom: 8px;">Xarajatlar Diagrammasi</div>
      <div class="chart-container">
        <canvas id="financeChart"></canvas>
      </div>
    </div>

    <div class="card">
      <div class="bal-title" style="margin-bottom: 10px; display: flex; justify-content: space-between;">
        <span>So'nggi Amaliyotlar</span>
        <span style="color: #38bdf8; cursor: pointer; text-transform: none;" onclick="clearAllData()">Tozalash</span>
      </div>
      <div id="txList">
        <p style="text-align: center; color: var(--text-muted); font-size: 13px; padding: 12px;">Hozircha amaliyotlar yo'q</p>
      </div>
    </div>
  </div>

  <!-- Kiritish modali -->
  <div class="modal" id="inputModal">
    <div class="modal-box">
      <h3 id="modalTitle" style="font-size: 17px; font-weight: 700; margin-bottom: 14px;">Amal kiritish</h3>
      <input type="number" id="inAmt" class="custom-input" placeholder="Summa (masalan: 50000)" inputmode="numeric">
      <input type="text" id="inCat" class="custom-input" placeholder="Kategoriya (masalan: Bozor, Transport)">
      
      <button class="act-btn btn-inc" id="saveBtn" style="width: 100%; margin-top: 4px;" onclick="addRecord()">Saqlash</button>
      <button onclick="closeInput()" style="width: 100%; background: transparent; border: none; color: var(--text-muted); font-size: 14px; padding: 12px; margin-top: 4px; cursor: pointer;">Bekor qilish</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try { tg.setHeaderColor('#07090e'); } catch(e) {}
    }

    // Faqat ruxsat etilgan 2 ta ID
    const ALLOWED_IDS = [7789172387, 8622259094];
    const userId = tg?.initDataUnsafe?.user?.id;
    const userName = tg?.initDataUnsafe?.user?.first_name || "Moliya";

    // Agar begona Telegram ID bo'lsa darhol bloklash
    if (userId && !ALLOWED_IDS.includes(userId)) {
      document.getElementById('appContent').style.display = 'none';
      document.getElementById('blockedScreen').style.display = 'flex';
    } else {
      document.getElementById('appContent').style.display = 'block';
      document.getElementById('blockedScreen').style.display = 'none';
      document.getElementById('userNameTxt').innerText = userName;
    }

    let records = JSON.parse(localStorage.getItem('moliya_data_v2') || '[]');
    let currentMode = 'expense';
    let chartObj = null;

    function openInput(mode) {
      currentMode = mode;
      document.getElementById('modalTitle').innerText = mode === 'income' ? "Kirim qo'shish" : "Chiqim qo'shish";
      const btn = document.getElementById('saveBtn');
      btn.className = mode === 'income' ? 'act-btn btn-inc' : 'act-btn btn-exp';
      document.getElementById('inAmt').value = '';
      document.getElementById('inCat').value = '';
      document.getElementById('inputModal').style.display = 'flex';
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function closeInput() {
      document.getElementById('inputModal').style.display = 'none';
    }

    function addRecord() {
      const amt = parseFloat(document.getElementById('inAmt').value);
      const cat = document.getElementById('inCat').value.trim() || (currentMode === 'income' ? 'Kirim' : 'Xarajat');

      if (!amt || amt <= 0) return;

      records.unshift({
        id: Date.now(),
        type: currentMode,
        amount: amt,
        category: cat,
        date: new Date().toLocaleDateString('uz-UZ', { day: '2-digit', month: 'short' })
      });

      localStorage.setItem('moliya_data_v2', JSON.stringify(records));
      closeInput();
      renderAll();
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    }

    function clearAllData() {
      if (confirm("Hamma yozuvlar o'chirilsinmi?")) {
        records = [];
        localStorage.removeItem('moliya_data_v2');
        renderAll();
      }
    }

    function renderAll() {
      let incomeSum = 0;
      let expenseSum = 0;
      const catStats = {};

      records.forEach(r => {
        if (r.type === 'income') {
          incomeSum += r.amount;
        } else {
          expenseSum += r.amount;
          catStats[r.category] = (catStats[r.category] || 0) + r.amount;
        }
      });

      const netBalance = incomeSum - expenseSum;

      document.getElementById('totalBalanceVal').innerHTML = `${netBalance.toLocaleString()} <span>UZS</span>`;
      document.getElementById('incTotalVal').innerText = `+${incomeSum.toLocaleString()} UZS`;
      document.getElementById('expTotalVal').innerText = `-${expenseSum.toLocaleString()} UZS`;

      const listEl = document.getElementById('txList');
      if (records.length === 0) {
        listEl.innerHTML = `<p style="text-align: center; color: var(--text-muted); font-size: 13px; padding: 12px;">Hozircha amaliyotlar yo'q</p>`;
      } else {
        listEl.innerHTML = records.slice(0, 8).map(r => `
          <div class="tx-item">
            <div>
              <div class="tx-name">${r.category}</div>
              <div class="tx-date">${r.date}</div>
            </div>
            <div class="tx-amt" style="color: ${r.type === 'income' ? 'var(--income)' : 'var(--expense)'}">
              ${r.type === 'income' ? '+' : '-'}${r.amount.toLocaleString()} UZS
            </div>
          </div>
        `).join('');
      }

      renderChart(catStats);
    }

    function renderChart(catStats) {
      const labels = Object.keys(catStats);
      const data = Object.values(catStats);

      if (chartObj) chartObj.destroy();

      const canvas = document.getElementById('financeChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      chartObj = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels.length ? labels : ['Xarajat yo\'q'],
          datasets: [{
            data: data.length ? data : [1],
            backgroundColor: labels.length 
              ? ['#f43f5e', '#38bdf8', '#f59e0b', '#10b981', '#8b5cf6', '#ec4899', '#64748b']
              : ['rgba(255, 255, 255, 0.08)'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { color: '#94a3b8', font: { size: 11, family: "'Plus Jakarta Sans', sans-serif" } }
            }
          }
        }
      });
    }

    renderAll();
  </script>
</body>
</html>
